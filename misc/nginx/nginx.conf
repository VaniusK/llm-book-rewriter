worker_processes auto;

events {
    worker_connections 1024;
}

http {

    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=3r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    limit_req_status 429;

    #frontend
    server {
        listen 443 ssl;
        client_max_body_size 10M;
        http2 on;
        server_name localhost; # change to domain name on deploy(localhost -> texthone.ru)

        ssl_certificate /etc/letsencrypt/live/localhost/fullchain.pem; # change to domain name on deploy(localhost -> texthone.ru)
        ssl_certificate_key /etc/letsencrypt/live/localhost/privkey.pem; # change to domain name on deploy(localhost -> texthone.ru)

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        location / {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_buffering off;
        }
    }

}