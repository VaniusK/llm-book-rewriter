services:
  website:
    build: 
      context: .
      dockerfile: WebsiteDockerfile
    ports:
      - "8000:8000"
  bot:
    build: 
      context: .
      dockerfile: BotDockerfile
    env_file:
      - .env
  
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./misc/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./misc/certbot/www:/var/www/certbot:ro
      - ./misc/certbot/conf:/etc/letsencrypt:ro
    restart: unless-stopped
    depends_on:
      - website
      - bot
  
  certbot:
    image: certbot/certbot
    volumes:
      - ./misc/certbot/www:/var/www/certbot:rw
      - ./misc/certbot/conf:/etc/letsencrypt:rw